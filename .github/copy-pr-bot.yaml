# Configuration for the copy-pr-bot GitHub App:
# https://docs.gha-runners.nvidia.com/apps/copy-pr-bot/
#
# The bot copies trusted PRs to `pull-request/<number>`, and that push starts
# Full CI and the advisory performance workflows on the self-hosted pools.
# Drafts are not copied automatically: they run Fast CI only until they are
# marked ready. `/ok to test <sha>` still copies a draft on request.
enabled: true
auto_sync_draft: false
auto_sync_ready: true
